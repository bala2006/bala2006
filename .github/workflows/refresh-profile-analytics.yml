name: Refresh profile analytics

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-profile-analytics.yml'
      - 'scripts/update-profile-analytics.mjs'

permissions:
  contents: write

concurrency:
  group: profile-analytics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch public repository activity and render charts
        run: node scripts/update-profile-analytics.mjs

      - name: Commit refreshed analytics
        run: |
          if [[ -z "$(git status --porcelain data/profile-analytics.json assets/analytics)" ]]; then
            echo "Analytics are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/profile-analytics.json assets/analytics/
          git commit -m "chore: refresh profile analytics"
          git push

