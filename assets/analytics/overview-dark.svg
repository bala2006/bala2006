<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">GitHub profile analytics overview</title><desc id="desc">Repository, star, fork, commit, language, and project-area summaries for public non-fork repositories.</desc><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#edf4f4;font-size:24px;font-weight:700}.subtitle{fill:#96a8ad;font-size:13px}.label{fill:#edf4f4;font-size:13px}.muted{fill:#96a8ad;font-size:12px}.tiny{fill:#687c82;font-size:10px}.value{fill:#edf4f4;font-size:29px;font-weight:700}.card{fill:#131e24;stroke:#2a3a40;stroke-width:1}.track{fill:#26363c}.accent{fill:#56d6bf}</style><rect width="1200" height="500" rx="22" fill="#0d1419"/><text x="40" y="52" class="title">PROFILE ANALYTICS</text><text x="40" y="77" class="subtitle">Public, non-fork repositories · refreshed 2026-10-20</text><g><rect class="card" x="40" y="102" width="258" height="104" rx="15"/><text x="58" y="129" class="tiny">PUBLIC REPOS</text><text x="58" y="166" class="value">17</text><text x="58" y="190" class="tiny">owned repositories</text></g><g><rect class="card" x="320" y="102" width="258" height="104" rx="15"/><text x="338" y="129" class="tiny">STARS</text><text x="338" y="166" class="value">8</text><text x="338" y="190" class="tiny">across public repos</text></g><g><rect class="card" x="600" y="102" width="258" height="104" rx="15"/><text x="618" y="129" class="tiny">FORKS</text><text x="618" y="166" class="value">0</text><text x="618" y="190" class="tiny">across public repos</text></g><g><rect class="card" x="880" y="102" width="258" height="104" rx="15"/><text x="898" y="129" class="tiny">COMMITS · 52 WEEKS</text><text x="898" y="166" class="value">219</text><text x="898" y="190" class="tiny">default branch activity</text></g><rect class="card" x="40" y="232" width="530" height="218" rx="16"/><text x="58" y="258" class="label">Primary language by repository</text><text