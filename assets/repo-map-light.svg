<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Repository map</title>
  <desc id="desc">A visual map grouping public repositories into five themes: AI systems and developer tools, forecasting and reliability, machine learning research, apps and creative tools, and experiments and community tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfa"/>
      <stop offset="1" stop-color="#edf4f3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53d6bd"/>
      <stop offset="1" stop-color="#73e3cf"/>
    </linearGradient>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .eyebrow { fill: #147f70; font-size: 13px; font-weight: 700; letter-spacing: 2px; }
      .heading { fill: #17272c; font-size: 28px; font-weight: 700; }
      .subtitle { fill: #5d7176; font-size: 15px; }
      .card-title { fill: #17272c; font-size: 17px; font-weight: 650; }
      .card-sub { fill: #62777c; font-size: 12px; }
      .repo { fill: #42585e; font-size: 13px; }
      .count { fill: #137e70; font-size: 12px; font-weight: 700; }
      .line { stroke: #aac6c0; stroke-width: 1.5; fill: none; }
      .dot { fill: #5dd9c3; }
    </style>
  </defs>
  <rect width="1200" height="700" rx="24" fill="url(#bg)"/>
  <circle cx="1100" cy="95" r="120" fill="#54d6bd" opacity=".06"/>
  <circle cx="170" cy="650" r="180" fill="#54d6bd" opacity=".05"/>

  <text x="52" y="58" class="eyebrow">BALA2006 · PUBLIC REPOSITORIES</text>
  <text x="52" y="101" class="heading">A portfolio map, by problem space</text>
  <text x="52" y="129" class="subtitle">17 public projects · grouped into five themes</text>
  <rect x="52" y="151" width="1096" height="2" rx="1" fill="url(#accent)" opacity=".8"/>

  <!-- Shared portfolio center -->
  <rect x="461" y="300" width="278" height="104" rx="20" fill="#eff8f6" stroke="#53d6bd" stroke-width="1.5"/>
  <circle cx="501" cy="352" r="22" fill="#53d6bd" opacity=".13"/>
  <path d="M491 352h20M501 342v20M494 345l14 14M508 345l-14 14" stroke="#117f71" stroke-width="2" stroke-linecap="round"/>
  <text x="536" y="346" class="card-title">Building across domains</text>
  <text x="536" y="371" class="card-sub">AI · apps · forecasting · research</text>

  <!-- Connectors -->
  <path class="line" d="M461 326 C410 295 392 243 357 229"/><circle class="dot" cx="357" cy="229" r="4"/>
  <path class="line" d="M461 380 C405 421 392 468 357 481"/><circle class="dot" cx="357" cy="481" r="4"/>
  <path class="line" d="M739 326 C790 295 808 243 843 229"/><circle class="dot" cx="843" cy="229" r="4"/>
  <path class="line" d="M739 380 C795 421 808 468 843 481"/><circle class="dot" cx="843" cy="481" r="4"/>
  <path class="line" d="M600 404 C600 469 600 503 600 535"/><circle class="dot" cx="600" cy="535" r="4"/>

  <!-- Cards -->
  <g>
    <rect x="52" y="177" width="306" height="148" rx="16" fill="#ffffff" stroke="#cbdad7"/>
    <circle cx="78" cy="207" r="7" fill="#168d7d"/>
    <text x="96" y="213" class="card-title">AI systems &amp; developer tools</text>
    <text x="78" y="242" class="repo">Nero · Octopus · AgentMesh MCP</text>
    <text x="78" y="265" class="repo">Laya Browser MCP · Kiro Toolkit</text>
    <text x="78" y="300" class="count">5 PROJECTS</text>
  </g>
  <g>
    <rect x="52" y="411" width="306" height="148" rx="16" fill="#ffffff" stroke="#cbdad7"/>
    <circle cx="78" cy="441" r="7" fill="#7061bb"/>
    <text x="96" y="447" class="card-title">Forecasting &amp; reliability</text>
    <text x="78" y="476" class="repo">RailResilient · Transport Demand</text>
    <text x="78" y="499" class="repo">JMA ETAS · Traffic Safety Benchmark</text>
    <text x="78" y="534" class="count" fill="#7061bb">4 PROJECTS</text>
  </g>
  <g>
    <rect x="842" y="177" width="306" height="148" rx="16" fill="#ffffff" stroke="#cbdad7"/>
    <circle cx="868" cy="207" r="7" fill="#ae6a00"/>
    <text x="886" y="213" class="card-title">Machine learning research</text>
    <text x="868" y="242" class="repo">Reliable Deepfake Detection</text>
    <text x="868" y="265" class="repo">Voice Detection</text>
    <text x="868" y="300" class="count" fill="#ae6a00">2 PROJECTS</text>
  </g>
  <g>
    <rect x="842" y="411" width="306" height="148" rx="16" fill="#ffffff" stroke="#cbdad7"/>
    <circle cx="868" cy="441" r="7" fill="#2764a7"/>
    <text x="886" y="447" class="card-title">Apps &amp; creative tools</text>
    <text x="868" y="476" class="repo">Helium · Tactical Grid</text>
    <text x="868" y="499" class="repo">Luna Calorie Releases · Crazy Ads</text>
    <text x="868" y="534" class="count" fill="#2764a7">4 PROJECTS</text>
  </g>
  <g>
    <rect x="420" y="535" width="360" height="112" rx="16" fill="#ffffff" stroke="#cbdad7"/>
    <circle cx="449" cy="565" r="7" fill="#b6384d"/>
    <text x="467" y="571" class="card-title">Experiments &amp; community tools</text>
    <text x="449" y="600" class="repo">Laya Rail · Cobblemon Client</text>
    <text x="449" y="629" class="count" fill="#b6384d">2 PROJECTS</text>
  </g>

  <text x="52" y="678" class="card-sub">Curated from the public repositories visible on GitHub · project groupings are a portfolio guide, not dependency links</text>
</svg>


