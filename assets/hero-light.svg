<svg xmlns="http://www.w3.org/2000/svg" width="800" height="202" viewBox="0 0 800 202" role="img" aria-labelledby="t d"><title id="t">Bala Chandra Sekhar Reddy Moole introduction</title><desc id="d">@bala2006. I build AI systems, research tools, and apps, then make the results easy to inspect. Currently building Nero, an on-device assistant that plans tasks, calls tools, and talks to MCP servers.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.title{fill:#1f2328;font-size:16px;font-weight:600}.sub{fill:#59636e;font-size:12px}.note{fill:#818b98;font-size:11px}.label{fill:#59636e;font-size:11px}.value{fill:#1f2328;font-size:20px;font-weight:600}.repo{fill:#1f2328;font-size:12px}.count{fill:#59636e;font-size:11px}.hero-handle{fill:#0969da;font-size:12px;font-weight:600}.hero-name{fill:#1f2328;font-size:30px;font-weight:600;letter-spacing:-.5px}.hero-name-sm{fill:#1f2328;font-size:18px;font-weight:600;letter-spacing:-.2px}.hero-tag{fill:#59636e;font-size:14px}.hero-eyebrow{fill:#818b98;font-size:10px;font-weight:600;letter-spacing:.9px}.hero-building{fill:#1f2328;font-size:15px;font-weight:600}.hero-building-note{fill:#59636e;font-size:12px}</style><rect width="800" height="202" rx="6" fill="#ffffff"/><rect x="0.5" y="0.5" width="799" height="201" rx="6" fill="none" stroke="#d0d7de"/><text x="24" y="44" class="hero-handle">@bala2006</text><text x="24" y="82" class="hero-name">Bala Chandra Sekhar Reddy Moole</text><text x="24" y="110" class="hero-tag">I build AI systems, research tools, and apps, then make the results easy to inspect.</text><line x1="24" y1="132" x2="776" y2="132" stroke="#d0d7de"/><text x="24" y="156" class="hero-eyebrow">CURRENTLY BUILDING</text><text x="24" y="178" class="hero-building">Nero</text><text x="76" y="178" class="hero-building-note">an on-device assistant that plans tasks, calls tools, and talks to MCP servers.</text></svg>